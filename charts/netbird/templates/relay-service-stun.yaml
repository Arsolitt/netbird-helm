{{- $first := true -}}
{{- range $instance := .Values.relay.instances -}}
{{- $stun := $instance.stun | default dict -}}
{{- if $stun.enabled -}}
{{- if not $first }}
---
{{ end -}}
{{- $first = false -}}
{{- $context := dict "root" $ "instance" $instance -}}
{{- $stunService := $stun.service | default dict -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netbird.fullname" $ }}-relay-{{ $instance.name }}-stun
  namespace: {{ include "netbird.namespace" $ }}
  labels:
    {{- include "netbird.relay.labels" $context | nindent 4 }}
  {{- with $stunService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $stunService.type | default "ClusterIP" }}
  {{- if and (eq ($stunService.type | default "ClusterIP") "LoadBalancer") $stunService.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $stunService.externalTrafficPolicy }}
  {{- end }}
  ports:
    {{- range $port := $stun.ports }}
    - port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
      name: stun-{{ $port }}
    {{- end }}
  selector:
    {{- include "netbird.relay.selectorLabels" $context | nindent 4 }}
  {{- with $stunService.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
{{- end -}}
